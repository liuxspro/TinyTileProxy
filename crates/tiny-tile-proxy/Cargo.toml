[package]
name = "tiny-tile-proxy"
authors = ["liuxspro <liuxspro@gmail.com>"]
version = "0.1.10"
repository = "https://github.com/liuxspro/TinyTileProxy"
edition = "2021"

[[bin]]
name = "TinyTileProxy"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
reqwest = { workspace = true }
figment = { version = "0.10", features = ["toml"] }
minijinja = { version = "2" }
rocket = { version = "0.5.1", features = ["json"] }
rust-embed = "8.5.0"
serde = { workspace = true }
tokio = { version = "1", features = ["full"] }
toml = "0.8.19"
# My Crates
# webp_to_png = { git = "https://github.com/liuxspro/libs" }
jilin1 = { path = "../jilin1" }
filetype = { path = "../filetype" }
capgen = { path = "../capgen" }
